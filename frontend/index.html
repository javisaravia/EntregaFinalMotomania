<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido - MotoManía</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/utils.js"></script>
</head>

<body>

  <div class="flex-center">
    <div class="card" style="max-width: 380px; width: 100%;">
      <img src="motomaniafoto.png" alt="Logo MotoManía" class="logo-centered"
        style="display: block; margin: 0 auto 20px;">

      <h2 style="text-align: center; margin-bottom: 30px;">Bienvenido a Motomania</h2>

      <input id="email" type="email" class="dark-input" placeholder="Correo electrónico">
      <input id="password" type="password" class="dark-input" placeholder="Contraseña">

      <button id="loginBtn" class="btn-primary">Iniciar Sesión</button>
      <button id="goRegisterBtn" type="button" class="btn-secondary" style="margin-top: 15px;">Crear una cuenta
        nueva</button>
    </div>
  </div>


  <script type="module">
    import { API_BASE_URL } from './js/config.js';
    const loginBtn = document.getElementById("loginBtn");
    const goRegisterBtn = document.getElementById("goRegisterBtn");

    loginBtn.addEventListener("click", async () => {
      if (typeof axios === 'undefined') {
        mostrarToast("Error: No se pudo conectar con el servidor de autenticación", "error");
        return;
      }
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        mostrarToast("Rellena todos los campos", "error");
        return;
      }

      toggleSpinner(true);

      try {
        const res = await axios.post(`${API_BASE_URL}/api/auth/login`, {
          email,
          password
        });

        localStorage.setItem("token", res.data.token);
        localStorage.setItem("user", JSON.stringify(res.data.user));

        mostrarToast("¡Bienvenido de nuevo!", "success");

        setTimeout(() => {
          window.location.href = "routes.html";
        }, 1500);

      } catch (err) {
        const msg = err.response?.data?.error || "Email o contraseña incorrectos";
        mostrarToast(msg, "error");
      } finally {
        toggleSpinner(false);
      }
    });

    goRegisterBtn.addEventListener("click", () => {
      window.location.href = "register.html";
    });
  </script>

</body>

</html>
