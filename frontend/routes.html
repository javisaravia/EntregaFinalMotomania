<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas - Motomanía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="spinner" style="display:none;">Cargando...</div>
    <header class="header-app">
        <h2>🏍️ MotoManía</h2>
        <div class="header-buttons">
            <a href="clubs.html" class="btn-secondary" style="width:auto; padding:8px 16px;">🧥 Clubes</a>
            <button class="btn-secondary" onclick="window.logout()" style="width:auto; padding:8px 16px;">Salir</button>
        </div>
    </header>
    <div class="main-container">
        <aside class="sidebar">
            <div>
                <h3>Mis Rutas</h3>
                <button class="btn-primary" onclick="window.activarModoCreacion()">+ Crear Nueva Ruta</button>
                <div id="lista-rutas" style="margin-top: 15px;"></div>
            </div>
        </aside>
        <div id="map"></div>
        <div id="route-details-panel">
            <span class="close-panel" onclick="window.cerrarDetalles()">&times;</span>
            <h3 id="panel-title"></h3>
            <p id="panel-desc"></p>
            <div id="panel-stats" style="margin-bottom:15px; font-size:0.9rem;"></div>
            <div id="star-rating-ui">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <p id="avg-rating-text" style="font-size:0.8rem; color:#888;"></p>
            <div id="comments-container" style="margin-top:10px;"></div>
            <div class="comment-form" style="margin-top:20px;">
                <textarea id="comment-text" placeholder="Escribe un comentario..." rows="2"
                    style="width:100%; background:#0f172a; border:1px solid #334155; color:white; padding:10px; border-radius:8px;"></textarea>
                <button class="btn-primary" onclick="window.subirComentario()"
                    style="margin-top:10px;">Publicar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE INICIALIZACIÓN GLOBAL -->
    <script>
        window.logout = function () {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        };
        window.cerrarDetalles = function () {
            document.getElementById('route-details-panel').classList.remove('active');
        };
        window.activarModoCreacion = function () {
            if (window.manualInitCreation) window.manualInitCreation();
            else alert("Cargando mapas...");
        };
        window.subirComentario = function () {
            if (window.manualSubmitComment) window.manualSubmitComment();
        };
        window.enviarValoracion = function (rating) {
            if (window.manualSubmitRating) window.manualSubmitRating(rating);
        };

    </script>

    <script type="module">
        const BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000'
            : 'https://entregafinalmotomania.onrender.com';

        // SEGURIDAD: Obtener userId del localStorage
        let currentUserId = null;
        try {
            const userStr = localStorage.getItem('user');
            if (!userStr) { window.location.href = 'index.html'; }
            const userObj = JSON.parse(userStr);
            currentUserId = userObj.user ? userObj.user.id : userObj.id;
        } catch (e) { window.location.href = 'index.html'; }

        // MAPA
        const map = L.map('map').setView([40.416, -3.703], 6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let modoCreacion = false, puntoInicio = null, marcadorInicio = null, currentRouteId = null;

        window.manualInitCreation = () => {
            modoCreacion = true; puntoInicio = null;
            if (marcadorInicio) map.removeLayer(marcadorInicio);
            document.getElementById('map').style.cursor = 'crosshair';
            alert("1. Haz clic en el INICIO | 2. Haz clic en el FINAL");
        };

        map.on('click', async (e) => {
            if (!modoCreacion) return;
            if (!puntoInicio) {
                puntoInicio = e.latlng;
                marcadorInicio = L.marker(puntoInicio).addTo(map).bindPopup("Salida").openPopup();
                return;
            }
            const puntoFinal = e.latlng;
            document.getElementById('spinner').style.display = 'flex';
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${puntoInicio.lng},${puntoInicio.lat};${puntoFinal.lng},${puntoFinal.lat}?overview=full&geometries=geojson`;
                const d = await (await fetch(url)).json();
                if (d.routes && d.routes.length > 0) {
                    const r = d.routes[0], coords = L.geoJSON(r.geometry).getLayers()[0].getLatLngs();
                    const titulo = prompt("Nombre de la ruta:");
                    if (!titulo) return;
                    const res = await fetch(`${BASE_URL}/api/routes/guardar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: titulo, coordinates: coords, user_id: currentUserId,
                            distance: (r.distance / 1000).toFixed(2), duration: Math.round(r.duration / 60)
                        })
                    });
                    if (res.ok) { alert("¡Ruta guardada!"); cargarMisRutas(); }
                    else { const err = await res.json(); alert("Error: " + (err.detalles || err.error)); }
                }
            } catch (e) { alert("Error al guardar."); } finally {
                modoCreacion = false; document.getElementById('spinner').style.display = 'none';
                if (marcadorInicio) map.removeLayer(marcadorInicio);
                document.getElementById('map').style.cursor = '';
            }
        });

        async function cargarMisRutas() {
            const container = document.getElementById('lista-rutas');
            container.innerHTML = "Cargando...";
            try {
                const res = await fetch(`${BASE_URL}/api/routes/${currentUserId}`);
                const rs = await res.json();
                container.innerHTML = rs.map(r => `
                    <div class="db-route-item" onclick='window.mostrarDetallesRuta(${JSON.stringify(r)})'>
                        <h4>${r.title}</h4>
                        <small>${r.distance} Km | ${r.duration} min</small>
                    </div>
                `).join('') || "Sin rutas.";
            } catch (e) { container.innerHTML = "Error de conexión."; }
        }

        window.mostrarDetallesRuta = (r) => {
            currentRouteId = r.id;
            document.getElementById('panel-title').innerText = r.title;
            document.getElementById('panel-desc').innerText = r.description || 'Sin descripción';
            document.getElementById('panel-stats').innerHTML = `Distancia: ${r.distance} Km | Tiempo: ${r.duration} min`;
            document.getElementById('route-details-panel').classList.add('active');
            const coords = JSON.parse(r.coordinates);
            const poly = L.polyline(coords, { color: 'red', weight: 5 }).addTo(map);
            map.fitBounds(poly.getBounds());
            cargarComentarios(r.id);
            document.querySelectorAll('.star').forEach(s => {
                s.classList.remove('active');
                if (parseInt(s.dataset.value) <= Math.round(r.avg_rating || 0)) s.classList.add('active');
            });
        };

        async function cargarComentarios(id) {
            if (!id) return;
            const c = document.getElementById('comments-container');
            // NO ponemos "Cargando..." aquí para evitar saltos bruscos si el usuario prefiere limpieza
            c.innerHTML = '';
            try {
                const res = await fetch(`${BASE_URL}/api/routes/${id}/comentarios`);
                // SEGURIDAD: Solo parsear si la respuesta es OK
                if (!res.ok) {
                    console.error("⚠️ Error servidor al cargar comentarios");
                    return;
                }
                const cms = await res.json();
                if (cms.length === 0) {
                    c.innerHTML = '<p style="color:#777; font-size:0.8rem;">Sin comentarios aún. ¡Sé el primero!</p>';
                } else {
                    c.innerHTML = cms.map(cm => `
                        <div style="padding:10px; border-bottom:1px solid #334155; font-size:0.85rem; color:#f1f5f9;">
                            <b style="color:var(--accent-primary)">@${cm.username}:</b> ${cm.comment}
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error("🔥 Error fatídico cargando comentarios:", e.message);
            }
        }

        window.manualSubmitComment = async () => {
            const t = document.getElementById('comment-text');
            const commentVal = t.value.trim();

            // Obtenemos ID de la ruta: prioridad variable global, luego URL param
            const urlParams = new URLSearchParams(window.location.search);
            const routeId = currentRouteId || urlParams.get('route_id');

            if (!commentVal) return alert("Escribe algo antes de publicar.");
            if (!routeId) return alert("Error: No se ha detectado la ruta seleccionada.");

            try {
                const res = await fetch(`${BASE_URL}/api/routes/comentar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ route_id: routeId, user_id: currentUserId, comment: commentVal })
                });

                if (res.ok) {
                    alert('¡Gracias por publicar tu comentario!');
                    t.value = ''; // Limpiar textarea
                    cargarComentarios(routeId); // Refresco automático
                } else {
                    // Evitar 'Unexpected token <' si el servidor escupe un HTML de error (404/500)
                    const errorText = await res.text();
                    console.error("❌ Error del servidor:", errorText);
                    alert("No se pudo publicar el comentario. Revisa la consola.");
                }
            } catch (e) {
                console.error("🔥 Error de conexión:", e.message);
                alert("Error de conexión al publicar.");
            }
        };

        window.manualSubmitRating = async (rating) => {
            if (!currentRouteId) return alert("Selecciona una ruta antes de valorar.");
            try {
                const res = await fetch(`${BASE_URL}/api/routes/valorar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ route_id: currentRouteId, user_id: currentUserId, rating: rating })
                });
                if (res.ok) {
                    alert("¡Gracias por tu valoración!");
                    cargarMisRutas(); // Recargar para ver la nueva media
                } else {
                    const errorMsg = await res.text();
                    console.error("⚠️ Error rating:", errorMsg);
                    alert("Error al valorar.");
                }
            } catch (e) {
                console.error("🔥 Error conexión rating:", e.message);
            }
        };

        document.querySelectorAll('.star').forEach(star => {
            star.onclick = () => window.enviarValoracion(parseInt(star.dataset.value));
        });

        cargarMisRutas();
        // EXPORTACIÓN GLOBAL PARA VERCEL/BOTONES
        window.activarModoCreacion = manualInitCreation;
        window.logout = function () {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        };
        window.subirComentario = manualSubmitComment;
        window.enviarValoracion = manualSubmitRating;
        window.mostrarDetallesRuta = mostrarDetallesRuta;
        window.cerrarDetalles = cerrarDetalles;
    </script>
</body>

</html>
