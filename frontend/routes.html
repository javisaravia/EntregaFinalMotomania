<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas - Motomanía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* ... tus estilos se mantienen igual ... */
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 72px);
        }

        .sidebar {
            width: 320px;
            background: #1e293b;
            padding: 25px;
            overflow-y: auto;
            border-right: 1px solid #334155;
        }

        #map {
            flex: 1;
            z-index: 1;
        }

        .btn-primary {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 800;
        }

        .header-app {
            height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>

<body>
    <header class="header-app">
        <h2>🏍️ MotoManía</h2>
        <div class="header-buttons">
            <a href="clubs.html" style="color: white; text-decoration: none; margin-right: 20px;">🧥 Clubes</a>
            <button class="btn-logout" onclick="window.logout()">Salir</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <h3>Mis Rutas</h3>
            <button class="btn-primary" onclick="window.activarModoCreacion()">+ Crear Nueva Ruta</button>
            <div id="lista-rutas" style="margin-top: 15px;">Cargando...</div>
        </aside>
        <div id="map"></div>
    </div>

    <script type="module">
        // USAMOS TU URL DE RENDER DIRECTAMENTE PARA EVITAR FALLOS
        const API_BASE_URL = "https://entregafinalmotomania.onrender.com";

        // 1. ASIGNACIÓN GLOBAL (Para evitar el ReferenceError)
        window.logout = () => {
            localStorage.clear();
            window.location.href = 'index.html';
        };

        // 2. LÓGICA DE USUARIO
        let currentUserId = null;
        try {
            const user = JSON.parse(localStorage.getItem('user'));
            currentUserId = user?.id || user?.user?.id;
            if (!currentUserId) throw new Error();
        } catch (e) {
            window.location.href = 'index.html';
        }

        // 3. MAPA
        const map = L.map('map').setView([40.4, -3.7], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 4. CREACIÓN DE RUTAS
        let modoCreacion = false;
        let puntos = [];

        window.activarModoCreacion = () => {
            modoCreacion = true;
            puntos = [];
            alert("Haz clic en el mapa para marcar el ORIGEN y luego el DESTINO.");
        };

        map.on('click', async (e) => {
            if (!modoCreacion) return;

            puntos.push(e.latlng);
            L.marker(e.latlng).addTo(map);

            if (puntos.length === 2) {
                const nombre = prompt("Nombre de la ruta:");
                if (!nombre) return;

                const payload = {
                    title: nombre,
                    user_id: currentUserId,
                    coordinates: JSON.stringify(puntos),
                    distance: (map.distance(puntos[0], puntos[1]) / 1000).toFixed(2)
                };

                try {
                    const res = await fetch(`${API_BASE_URL}/api/routes`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        alert("¡Ruta guardada!");
                        location.reload();
                    } else {
                        alert("Error al guardar en el servidor");
                    }
                } catch (err) {
                    console.error("Error:", err);
                }
                modoCreacion = false;
            }
        });

        // 5. CARGAR RUTAS AL INICIO
        async function cargarRutas() {
            const res = await fetch(`${API_BASE_URL}/api/routes`);
            const rutas = await res.json();
            const lista = document.getElementById('lista-rutas');
            lista.innerHTML = rutas.map(r => `
                <div style="background:#0f172a; padding:10px; margin-bottom:10px; border-radius:8px; border-left: 4px solid #ef4444;">
                    <strong>${r.title}</strong><br>
                    <small>${r.distance} km</small>
                </div>
            `).join('');
        }

        cargarRutas();
    </script>
</body>

</html>
