<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro MotoManía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="js/utils.js"></script>
</head>

<body>

    <div class="flex-center">
        <div class="card" style="max-width: 400px; width: 100%;">
            <img src="motomaniafoto.png" alt="Logo MotoManía" class="logo-centered"
                style="display: block; margin: 0 auto 20px;">

            <h2 style="text-align: center; margin-bottom: 30px;">Crea tu cuenta</h2>

            <input id="username" type="text" class="dark-input" placeholder="Nombre de usuario">
            <input id="email" type="email" class="dark-input" placeholder="Correo electrónico">
            <input id="password" type="password" class="dark-input" placeholder="Contraseña">
            <input id="confirmPassword" type="password" class="dark-input" placeholder="Confirmar contraseña">

            <button id="registerBtn" class="btn-primary">Registrarse</button>
            <button onclick="window.location.href='index.html'" class="btn-secondary" style="margin-top: 15px;">¿Ya
                tienes cuenta? Ingresa</button>
        </div>
    </div>

    <script>
        document.getElementById('registerBtn').addEventListener('click', registrarUsuario);

        async function registrarUsuario() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // ✅ Validaciones básicas
            if (!username || !email || !password) {
                mostrarToast("Rellena todos los campos.", "error");
                return;
            }

            if (password !== confirmPassword) {
                mostrarToast("Las contraseñas no coinciden.", "error");
                return;
            }

            toggleSpinner(true);

            try {
                const respuesta = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mostrarToast("Usuario creado correctamente.", "success");

                    setTimeout(() => {
                        window.location.href = 'index.html'; // login
                    }, 1500);
                } else {
                    mostrarToast(datos.error || "No se pudo registrar.", "error");
                }

            } catch (error) {
                mostrarToast("Error de conexión con el servidor.", "error");
            } finally {
                toggleSpinner(false);
            }
        }
    </script>

</body>

</html>
