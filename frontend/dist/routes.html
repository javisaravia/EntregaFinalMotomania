<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas - Motomanía</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-primary: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #1e293b;
            --input-border: #334155;
            --radius-md: 8px;
            --font-main: 'Montserrat', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 0;
        }

        .header-app {
            height: 72px;
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            border-bottom: 1px solid var(--input-border);
        }

        .main-container {
            display: flex;
            height: calc(100vh - 72px);
            width: 100%;
        }

        .sidebar {
            width: 320px;
            background: var(--bg-secondary);
            overflow-y: auto;
            padding: 25px;
            border-right: 1px solid var(--input-border);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        #map {
            flex: 1;
            height: 100%;
            background-color: #0b0f1a;
            z-index: 1;
        }

        .btn-logout {
            background: #334155;
            color: white;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .btn-logout:hover {
            background: var(--accent-primary);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 800;
            cursor: pointer;
            width: 100%;
        }

        .btn-clubs-link {
            background: var(--bg-primary);
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--input-border);
        }

        .db-route-item {
            background: var(--bg-primary);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: var(--radius-md);
            border-left: 4px solid var(--accent-primary);
            cursor: pointer;
        }

        #route-details-panel {
            position: fixed;
            right: -400px;
            top: 72px;
            width: 380px;
            height: calc(100vh - 72px);
            background: var(--bg-secondary);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 1001;
            transition: right 0.4s;
            padding: 25px;
            overflow-y: auto;
        }

        #route-details-panel.active {
            right: 0;
        }

        .close-panel {
            cursor: pointer;
            float: right;
            font-size: 2rem;
        }

        .star {
            color: #444;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .star.active {
            color: #fbbf24;
        }

        #spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
        }
    </style>
</head>

<body>
    <div id="spinner">Cargando...</div>

    <header class="header-app">
        <h2>🏍️ MotoManía</h2>
        <div class="header-buttons">
            <a href="clubs.html" class="btn-clubs-link">🧥 Clubes</a>
            <button class="btn-logout" onclick="logout()">Salir</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div>
                <h3>Mis Rutas</h3>
                <button class="btn-primary" onclick="activarModoCreacion()">+ Crear Nueva Ruta</button>
                <div id="lista-rutas" style="margin-top: 15px;"></div>
            </div>
        </aside>
        <div id="map"></div>

        <div id="route-details-panel">
            <span class="close-panel" onclick="cerrarDetalles()">&times;</span>
            <h3 id="panel-title"></h3>
            <p id="panel-desc"></p>
            <div id="panel-stats"></div>
            <div id="star-rating-ui">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <p id="avg-rating-text"></p>
            <div id="comments-container"></div>
            <div class="comment-form">
                <textarea id="comment-text" placeholder="Escribe un comentario..." rows="2"
                    style="width:100%"></textarea>
                <input type="file" id="comment-file" accept="image/*">
                <button class="btn-primary" onclick="subirComentario()">Publicar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { API_BASE_URL } from './assets/config-B_CD02Rf.js';

        // --- GLOBALES PARA HTML ---
        window.logout = () => {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        };

        // --- SEGURIDAD ---
        let currentUserId = null;
        try {
            const u = JSON.parse(localStorage.getItem('user'));
            currentUserId = u.user ? u.user.id : u.id;
            if (!currentUserId) throw 'err';
        } catch (e) { window.location.href = 'index.html'; }

        // --- MAPA ---
        const map = L.map('map').setView([40.416, -3.703], 6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let modoCreacion = false, puntoInicio = null, marcadorInicio = null, currentRouteId = null;

        window.activarModoCreacion = () => {
            modoCreacion = true; puntoInicio = null;
            if (marcadorInicio) map.removeLayer(marcadorInicio);
            document.getElementById('map').style.cursor = 'crosshair';
            alert("1. Clic en SALIDA | 2. Clic en LLEGADA");
        };

        map.on('click', async (e) => {
            if (!modoCreacion) return;
            if (!puntoInicio) {
                puntoInicio = e.latlng;
                marcadorInicio = L.marker(puntoInicio).addTo(map).bindPopup("Salida").openPopup();
                return;
            }
            const puntoFinal = e.latlng;
            document.getElementById('spinner').style.display = 'flex';
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${puntoInicio.lng},${puntoInicio.lat};${puntoFinal.lng},${puntoFinal.lat}?overview=full&geometries=geojson`;
                const d = await (await fetch(url)).json();
                if (d.routes && d.routes.length > 0) {
                    const r = d.routes[0], coords = L.geoJSON(r.geometry).getLayers()[0].getLatLngs();
                    const titulo = prompt("Nombre:");
                    if (!titulo) return;
                    const res = await fetch(`${API_BASE_URL}/api/rutas/guardar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            titulo, coordenadas: coords, usuario_id: currentUserId,
                            distancia: (r.distance / 1000).toFixed(2), duracion: Math.round(r.duration / 60)
                        })
                    });
                    if (res.ok) { alert("¡Ruta guardada!"); cargarMisRutas(); }
                }
            } catch (e) { console.error(e); } finally {
                modoCreacion = false; document.getElementById('spinner').style.display = 'none';
                if (marcadorInicio) map.removeLayer(marcadorInicio);
                document.getElementById('map').style.cursor = '';
            }
        });

        async function cargarMisRutas() {
            const c = document.getElementById('lista-rutas');
            try {
                const rs = await (await fetch(`${API_BASE_URL}/api/rutas/${currentUserId}`)).json();
                c.innerHTML = rs.map(r => `
                    <div class="db-route-item" onclick="window.mostrarDetallesRuta(${JSON.stringify(r).replace(/"/g, '&quot;')})">
                        <h4>${r.title}</h4>
                        <small>${r.distance} Km | ${r.duration} min</small>
                    </div>
                `).join('');
            } catch (e) { }
        }

        window.mostrarDetallesRuta = (r) => {
            currentRouteId = r.id;
            document.getElementById('panel-title').innerText = r.title;
            document.getElementById('panel-desc').innerText = r.description || '';
            document.getElementById('panel-stats').innerHTML = `${r.distance} Km | ${r.duration} min`;
            document.getElementById('route-details-panel').classList.add('active');
            const coords = JSON.parse(r.coordinates);
            const poly = L.polyline(coords, { color: 'red' }).addTo(map);
            map.fitBounds(poly.getBounds());
            cargarComentarios(r.id);
        };

        window.cerrarDetalles = () => document.getElementById('route-details-panel').classList.remove('active');

        async function cargarComentarios(id) {
            const c = document.getElementById('comments-container');
            try {
                const cms = await (await fetch(`${API_BASE_URL}/api/rutas/${id}/comentarios`)).json();
                c.innerHTML = cms.map(cm => `<div><b>@${cm.username}:</b> ${cm.comment}</div>`).join('');
            } catch (e) { }
        }

        window.subirComentario = async () => {
            const t = document.getElementById('comment-text').value;
            if (!t) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/rutas/${currentRouteId}/comentarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUserId, comentario: t })
                });
                if (res.ok) { document.getElementById('comment-text').value = ''; cargarComentarios(currentRouteId); }
            } catch (e) { }
        };

        document.querySelectorAll('.star').forEach(s => {
            s.onclick = async () => {
                const v = s.dataset.value;
                try {
                    await fetch(`${API_BASE_URL}/api/rutas/${currentRouteId}/valorar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: currentUserId, rating: v })
                    });
                    alert("¡Gracias!");
                } catch (e) { }
            }
        });

        cargarMisRutas();
    </script>
</body>

</html>
