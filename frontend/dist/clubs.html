<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubes - Motomanía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-primary: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-border: #334155;
            --radius-md: 8px;
            --font-main: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
        }

        .header-app {
            height: 72px;
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            border-bottom: 1px solid var(--input-border);
        }

        .main-content {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .club-card {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--input-border);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            padding: 10px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn-back-link {
            color: white;
            text-decoration: none;
            background: #334155;
            padding: 8px 16px;
            border-radius: var(--radius-md);
        }

        .badge-member {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 8px;
            border-radius: var(--radius-md);
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header class="header-app">
        <h1>🧥 Zona de Clubes</h1>
        <a href="routes.html" class="btn-back-link">⬅ Volver al Mapa</a>
    </header>

    <div class="main-content">
        <h2>✅ Mis Clubes</h2>
        <div id="mis-clubes-container" class="grid">Cargando...</div>

        <h2>🌎 Explorar nuevos clubes</h2>
        <div id="todos-clubes-container" class="grid">Cargando...</div>
    </div>

    <!-- SCRIPT GLOBAL PREVIO -->
    <script>
        window.unirse = function (id, name) {
            if (window.unirseManual) {
                window.unirseManual(id, name);
            } else {
                alert("Cargando sistema de clubes...");
            }
        };
    </script>

    <script type="module">
        let BASE_URL = 'https://entregafinalmotomania.onrender.com';
        try {
            const config = await import('./assets/config-B_CD02Rf.js');
            BASE_URL = config.A || config.API_BASE_URL || window.API_BASE_URL || BASE_URL;
        } catch (e) { }

        let currentUserId = null;
        try {
            const u = JSON.parse(localStorage.getItem('user'));
            currentUserId = u.user ? u.user.id : u.id;
        } catch (e) { window.location.href = 'index.html'; }

        let misIds = [];

        async function cargar() {
            try {
                const res = await fetch(`${BASE_URL}/api/clubs/mis-clubes/${currentUserId}`);
                const mc = await res.json();
                misIds = mc.map(c => c.id);
                document.getElementById('mis-clubes-container').innerHTML = mc.map(c => `
                    <div class="club-card">
                        <h3>${c.name}</h3>
                        <p>${c.description || ''}</p>
                        <div class="badge-member">✓ Eres Miembro</div>
                    </div>
                `).join('') || 'Aún no perteneces a ningún club.';

                const resAll = await fetch(`${BASE_URL}/api/clubs`);
                const todos = await resAll.json();
                document.getElementById('todos-clubes-container').innerHTML = todos
                    .filter(c => !misIds.includes(c.id))
                    .map(c => `
                        <div class="club-card">
                            <h3>${c.name}</h3>
                            <p>${c.description || ''}</p>
                            <button class="btn-primary" onclick="window.unirse(${c.id}, '${c.name.replace(/'/g, "\\'")}')">Unirse</button>
                        </div>
                    `).join('') || '¡Ya estás en todos los clubes!';
            } catch (e) { }
        }

        window.unirseManual = async (id, name) => {
            if (!confirm(`¿Unirse a ${name}?`)) return;
            try {
                const res = await fetch(`${BASE_URL}/api/clubs/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId, clubId: id })
                });
                if (res.ok) { alert("¡Bienvenido!"); cargar(); }
                else { const err = await res.json(); alert("Error: " + err.error); }
            } catch (e) { alert("Error de conexión."); }
        };

        cargar();
    </script>
</body>

</html>
